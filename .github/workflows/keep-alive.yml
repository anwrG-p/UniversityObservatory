name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 \
            https://universityobservatory.onrender.com/api/health \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
